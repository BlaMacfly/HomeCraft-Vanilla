<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Sauvegarde et restauration</title>
  <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="960" height="400" fill="#fff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Sauvegarde et restauration de vos personnages</text>

  <rect x="20" y="70" width="220" height="130" rx="12" fill="#e3eefc" stroke="#3b6fb6" stroke-width="2"/>
  <text x="130" y="96" text-anchor="middle" font-weight="bold">Base MariaDB</text>
  <text x="130" y="120" text-anchor="middle" font-size="12">characters : personnages,</text>
  <text x="130" y="136" text-anchor="middle" font-size="12">objets, quêtes, courrier</text>
  <text x="130" y="158" text-anchor="middle" font-size="12">realmd : comptes</text>
  <text x="130" y="184" text-anchor="middle" font-size="11" fill="#666">jeu ouvert : « saveall » d'abord</text>

  <line x1="242" y1="135" x2="330" y2="135" stroke="#555" stroke-width="2" marker-end="url(#f)"/>
  <text x="286" y="126" text-anchor="middle" font-size="11">export</text>

  <rect x="332" y="60" width="300" height="150" rx="12" fill="#fff4d6" stroke="#c9a227" stroke-width="2"/>
  <text x="482" y="86" text-anchor="middle" font-weight="bold">sauvegarde-AAAAMMJJ-HHMMSS.zip</text>
  <text x="352" y="110" font-size="12">• characters.sql, realmd.sql</text>
  <text x="352" y="130" font-size="12">• vos réglages (settings.json)</text>
  <text x="352" y="150" font-size="12">• manifeste d'empreintes SHA-256</text>
  <text x="352" y="176" font-size="12" fill="#666">dans UserData\Sauvegardes</text>
  <text x="352" y="194" font-size="12" fill="#666">(gardé lors des mises à jour)</text>

  <rect x="680" y="60" width="260" height="150" rx="12" fill="#f7f7f7" stroke="#999"/>
  <text x="810" y="86" text-anchor="middle" font-weight="bold">Quand ?</text>
  <text x="700" y="110" font-size="12">• bouton SAUVEGARDER</text>
  <text x="700" y="130" font-size="12">• à chaque fermeture du jeu</text>
  <text x="716" y="146" font-size="12">(automatique, rotation)</text>
  <text x="700" y="166" font-size="12">• avant chaque restauration</text>
  <text x="716" y="182" font-size="12">(sauvegarde de sécurité)</text>

  <rect x="20" y="250" width="920" height="130" rx="12" fill="#fdeaea" stroke="#c0504d" stroke-width="2"/>
  <text x="40" y="276" font-weight="bold" fill="#8b2a27">Restaurer (onglet Sauvegardes, sélection puis « Restaurer la sélection », confirmation) :</text>
  <text x="40" y="302" font-size="13">1. le serveur de jeu est arrêté ;   2. une sauvegarde de sécurité de l'état actuel est faite ;   3. l'archive est vérifiée (empreintes) ;</text>
  <text x="40" y="326" font-size="13">4. les bases characters et realmd sont remplacées ;   5. vos réglages sont rétablis ;   6. vous redémarrez le serveur.</text>
  <text x="40" y="354" font-size="12" fill="#666">Le monde (base mangos) n'est jamais dans une sauvegarde : il vient du package (« Réimporter la base monde » dans Paramètres).</text>
</svg>
