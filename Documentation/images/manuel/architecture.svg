<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Architecture de HomeCraft Edition Vanilla</title>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Ce qui tourne sur votre PC quand vous jouez</text>

  <!-- Cadre PC -->
  <rect x="20" y="50" width="920" height="420" rx="14" fill="#f7f7f7" stroke="#999" stroke-dasharray="6 4"/>
  <text x="36" y="86" font-size="13" fill="#666">Votre PC (tout écoute sur 127.0.0.1 : rien n'est visible depuis le réseau)</text>

  <!-- Launcher -->
  <rect x="40" y="96" width="270" height="294" rx="12" fill="#fff4d6" stroke="#c9a227" stroke-width="2"/>
  <text x="175" y="116" text-anchor="middle" font-weight="bold" font-size="16" fill="#6b5200">Launcher HomeCraft</text>
  <text x="175" y="134" text-anchor="middle" font-size="12" fill="#6b5200">(HomeCraft Edition Vanilla.exe)</text>
  <rect x="58" y="148" width="234" height="40" rx="8" fill="#fff" stroke="#c9a227"/>
  <text x="175" y="173" text-anchor="middle">Interface (onglets, profils)</text>
  <rect x="58" y="196" width="234" height="40" rx="8" fill="#fff" stroke="#c9a227"/>
  <text x="175" y="221" text-anchor="middle">Orchestrateur des services</text>
  <rect x="58" y="244" width="234" height="40" rx="8" fill="#fff" stroke="#c9a227"/>
  <text x="175" y="262" text-anchor="middle">Pont IA des bots</text>
  <text x="175" y="277" text-anchor="middle" font-size="11" fill="#666">127.0.0.1:15910</text>
  <rect x="58" y="292" width="234" height="40" rx="8" fill="#fff" stroke="#c9a227"/>
  <text x="175" y="310" text-anchor="middle">Réseau multijoueur</text>
  <text x="175" y="325" text-anchor="middle" font-size="11" fill="#666">port 11010 (si partie ouverte)</text>
  <rect x="58" y="340" width="234" height="40" rx="8" fill="#fff" stroke="#c9a227"/>
  <text x="175" y="365" text-anchor="middle">Sauvegardes, vérification, réparation</text>

  <!-- Serveur -->
  <rect x="360" y="96" width="300" height="294" rx="12" fill="#e3eefc" stroke="#3b6fb6" stroke-width="2"/>
  <text x="510" y="116" text-anchor="middle" font-weight="bold" font-size="16" fill="#1d3f73">Serveur CMaNGOS Classic</text>
  <rect x="380" y="132" width="260" height="46" rx="8" fill="#fff" stroke="#3b6fb6"/>
  <text x="510" y="152" text-anchor="middle" font-weight="bold">realmd</text>
  <text x="510" y="170" text-anchor="middle" font-size="12" fill="#444">authentification · 127.0.0.1:3724</text>
  <rect x="380" y="190" width="260" height="78" rx="8" fill="#fff" stroke="#3b6fb6"/>
  <text x="510" y="210" text-anchor="middle" font-weight="bold">mangosd</text>
  <text x="510" y="228" text-anchor="middle" font-size="12" fill="#444">monde du jeu · 127.0.0.1:8085</text>
  <text x="510" y="248" text-anchor="middle" font-size="12" fill="#444">+ module playerbots (bots, IA)</text>
  <text x="510" y="262" text-anchor="middle" font-size="12" fill="#444">+ AHBot (hôtel des ventes)</text>
  <rect x="380" y="282" width="260" height="92" rx="8" fill="#fff" stroke="#3b6fb6"/>
  <text x="510" y="302" text-anchor="middle" font-weight="bold">MariaDB · 127.0.0.1:3315</text>
  <text x="510" y="322" text-anchor="middle" font-size="12" fill="#444">characters (vos personnages)</text>
  <text x="510" y="339" text-anchor="middle" font-size="12" fill="#444">realmd (comptes) · mangos (monde)</text>
  <text x="510" y="356" text-anchor="middle" font-size="12" fill="#444">logs · données dans UserData\Database</text>

  <!-- Client -->
  <rect x="710" y="96" width="210" height="134" rx="12" fill="#e4f5e4" stroke="#3e8e41" stroke-width="2"/>
  <text x="815" y="116" text-anchor="middle" font-weight="bold" font-size="16" fill="#225c25">Client du jeu</text>
  <text x="815" y="140" text-anchor="middle" font-size="12">WoW.exe 1.12.1 (d'origine)</text>
  <text x="815" y="158" text-anchor="middle" font-size="12">ou Benilla (64 bits)</text>
  <text x="815" y="182" text-anchor="middle" font-size="12" fill="#444">dossier Client\</text>
  <text x="815" y="200" text-anchor="middle" font-size="12" fill="#444">jamais fourni par HomeCraft</text>

  <!-- Flèches internes -->
  <line x1="310" y1="221" x2="378" y2="221" stroke="#444" stroke-width="2" marker-end="url(#f)"/>
  <text x="344" y="212" text-anchor="middle" font-size="11" fill="#444">démarre</text>
  <line x1="708" y1="150" x2="642" y2="155" stroke="#3e8e41" stroke-width="2" marker-end="url(#f)"/>
  <text x="675" y="140" text-anchor="middle" font-size="11" fill="#225c25">connexion</text>
  <line x1="708" y1="200" x2="642" y2="215" stroke="#3e8e41" stroke-width="2" marker-end="url(#f)"/>
  <line x1="510" y1="268" x2="510" y2="280" stroke="#3b6fb6" stroke-width="2" marker-end="url(#f)"/>
  <path d="M380,250 C340,250 330,264 294,264" fill="none" stroke="#8a4fbf" stroke-width="2" marker-end="url(#f)"/>
  <text x="338" y="282" text-anchor="middle" font-size="11" fill="#8a4fbf">dialogues IA</text>
  <path d="M175,90 C175,58 760,58 790,88" fill="none" stroke="#444" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="600" y="56" text-anchor="middle" font-size="11" fill="#444">JOUER : lance le client (profil prérempli)</text>

  <!-- Extérieur -->
  <rect x="40" y="480" width="270" height="62" rx="10" fill="#f1e6fa" stroke="#8a4fbf"/>
  <text x="175" y="504" text-anchor="middle" font-weight="bold" fill="#55307a">Fournisseur d'IA (facultatif)</text>
  <text x="175" y="524" text-anchor="middle" font-size="12">LM Studio / Ollama (local) ou en ligne</text>
  <line x1="175" y1="390" x2="175" y2="476" stroke="#8a4fbf" stroke-width="2" marker-end="url(#f)"/>
  <rect x="360" y="480" width="300" height="62" rx="10" fill="#fdeaea" stroke="#c0504d"/>
  <text x="510" y="504" text-anchor="middle" font-weight="bold" fill="#8b2a27">Amis invités (facultatif)</text>
  <text x="510" y="524" text-anchor="middle" font-size="12">liaison chiffrée vers 3724/8085 seulement</text>
  <path d="M292,320 C330,420 420,440 470,476" fill="none" stroke="#c0504d" stroke-width="2" marker-end="url(#f)" marker-start="url(#f)"/>
  <text x="730" y="504" font-size="12" fill="#444">MariaDB, console et reste du PC :</text>
  <text x="730" y="522" font-size="12" fill="#444">jamais accessibles aux invités</text>
</svg>
