[package]
name = "vanilla-solo-launcher"
version = "1.0.1"
edition = "2024"
license-file = "../LICENCE.txt"
description = "HomeCraft Edition Vanilla — launcher du serveur local World of Warcraft 1.12.1 solo"

[dependencies]
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust"] }
rand = "0.10.3"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography"] }
wow-mpq = { version = "0.7.0", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
ureq = "3"
tiny_http = "0.12"
snow = "0.10.0"
igd-next = "0.18.0"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[build-dependencies]
winresource = "0.1"
