[package]
name = "vanilla-solo-launcher"
version = "0.9.0"
edition = "2024"
license-file = "../LICENCE.txt"
description = "HomeCraft Edition Vanilla — launcher du serveur local World of Warcraft 1.12.1 solo"

[dependencies]
eframe = "0.32"
egui_extras = { version = "0.32", features = ["image"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
mysql = { version = "28.0.3", default-features = false, features = ["minimal-rust"] }
rand = "0.10.3"
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging"] }
wow-mpq = { version = "0.7.0", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"
